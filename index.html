<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SPA 교정 노트</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SPA 노트">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1f29" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}
body{margin:0;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
/* Layout: one-column study app, sticky top header, fixed bottom tab bar; red-pen "wrong" vs ink "right" */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --line:#dfe2e8; --fg:#1b2130; --muted:#646c7d;
  --ink:#1f4fd1; --ink-soft:#e7edfc; --pen:#c8372d; --pen-soft:#fbe9e7; --ok:#1d7f55; --ok-soft:#e3f3eb; --mark:#fff1a8;
  --f-display:"Space Grotesk","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151c; --surface:#1b1f29; --line:#2d3342; --fg:#e8ebf2; --muted:#9aa2b4;
  --ink:#7fa2ff; --ink-soft:#1f2a47; --pen:#ff7b6e; --pen-soft:#3a1f1d; --ok:#5fd19b; --ok-soft:#163327; --mark:#5a4d12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1b1f29; --line:#2d3342; --fg:#e8ebf2; --muted:#9aa2b4;
  --ink:#7fa2ff; --ink-soft:#1f2a47; --pen:#ff7b6e; --pen-soft:#3a1f1d; --ok:#5fd19b; --ok-soft:#163327; --mark:#5a4d12; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .in{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-size:1.15rem;margin:0;letter-spacing:-.01em}
h1 b{color:var(--ink)}
.stat{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
h2{font-family:var(--f-display);font-size:1.05rem;margin:0;text-wrap:balance}
.lbl{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,.item:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:600;min-height:48px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.bad{background:var(--pen-soft);border-color:var(--pen);color:var(--pen)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 0}
.stack{display:flex;flex-direction:column;gap:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.88rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.wrong{color:var(--pen)}
.right{color:var(--fg);font-weight:700;font-size:1.3rem;line-height:1.35}
.meaning{font-size:1.05rem}
.ex{background:var(--ink-soft);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.ex p{margin:0;flex:1;min-width:0}
.spk{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.spk svg{width:18px;height:18px}
.spk.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.reveal{border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted);background:transparent;width:100%}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.boxes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.boxes div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 4px}
.boxes b{display:block;font-family:var(--f-display);font-size:1.2rem;font-variant-numeric:tabular-nums}
.boxes span{font-size:.75rem;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.item{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:center;width:100%}
.item .t{flex:1;min-width:0}
.item .t div{font-size:.95rem}
.tag{font-family:var(--f-mono);font-size:.7rem;padding:2px 7px;border-radius:6px;background:var(--ink-soft);color:var(--ink);white-space:nowrap}
.done{color:var(--ok);font-size:.8rem;font-weight:600;white-space:nowrap}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font:inherit;color:var(--fg)}
.v-row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.v-row .w{font-size:.88rem}
.v-row .r{font-weight:700}
.v-row .m{font-size:.85rem;color:var(--muted)}
textarea{width:100%;min-height:140px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);color:var(--fg);font:inherit;line-height:1.6;resize:vertical}
.q{font-size:1.05rem;font-weight:600}
.tips{background:var(--mark);border-radius:10px;padding:12px 14px;font-size:.92rem}
.model{font-size:1rem;line-height:1.75}
.model .miss{background:var(--pen-soft);color:var(--pen);border-radius:3px;padding:0 2px}
.cover{font-family:var(--f-mono);font-size:.85rem}
details{border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;color:var(--muted);font-size:.9rem}
.old{font-size:.92rem;color:var(--muted);margin-top:8px}
.back{background:none;border:none;color:var(--ink);font-weight:600;padding:6px 0}
.mic{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--pen);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}.prog i{transition:none}}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav button{background:none;border:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.78rem;color:var(--muted)}
nav button svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--ink);font-weight:600}
.meta{font-size:.8rem;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.trend{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.trend span{display:flex;flex-direction:column;align-items:center;background:var(--ink-soft);border-radius:10px;padding:6px 10px;min-width:64px}
.trend small{font-size:.7rem;color:var(--muted)}.trend b{font-family:var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink)}
.trend i{font-style:normal;color:var(--muted)}.trend .unit{background:none;min-width:0;font-size:.78rem;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--line);padding:4px;border-radius:12px;position:static;border:0}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 2px;font-size:.82rem;color:var(--muted);flex-direction:row;display:block}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:st}
.steps li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;counter-increment:st}
.steps .role{font-family:var(--f-mono);font-size:.72rem;background:var(--ink-soft);color:var(--ink);border-radius:6px;padding:3px 7px;white-space:nowrap;min-width:64px;text-align:center}
.steps .role::before{content:counter(st) ". "}
.sline{display:flex;gap:8px;align-items:flex-start;min-width:0}.sline p{margin:0;flex:1;min-width:0;line-height:1.6}
.sline .spk{width:30px;height:30px}.sline .spk svg{width:15px;height:15px}
.timeline{display:flex;flex-direction:column;gap:12px}
.score{font-family:var(--f-display);color:var(--ok);font-weight:700;font-variant-numeric:tabular-nums}
.bd{display:grid;grid-template-columns:repeat(auto-fit,minmax(56px,1fr));gap:6px}
.bd span{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:8px;padding:4px}
.bd small{font-size:.7rem;color:var(--muted)}.bd b{font-variant-numeric:tabular-nums}
.mine{margin:6px 0 0;font-size:.92rem;color:var(--muted);line-height:1.6}
.exs{font-size:.85rem;margin-top:4px;color:var(--fg);opacity:.85}
.srcs{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.src{display:flex;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:.88rem}
.miss{background:var(--pen-soft);color:var(--pen);border-radius:3px;padding:0 2px}
.boxb{font:inherit;color:inherit;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center}
.boxb b{display:block;font-family:var(--f-display);font-size:1.2rem;font-variant-numeric:tabular-nums}.boxb span{font-size:.75rem;color:var(--muted)}
.boxb.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.st-hard{background:var(--pen-soft);color:var(--pen)}.st-learning{background:var(--mark);color:var(--fg)}.st-known{background:var(--ok-soft);color:var(--ok)}
.btn.ghost{background:transparent;border-style:dashed;font-weight:500;color:var(--muted)}
.undo{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.undo span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.undo button{border:0;background:none;color:var(--ink);font-weight:600;flex:none}
.stpick{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.stpick button{border:0;background:transparent;border-radius:8px;padding:7px 2px;font-size:.78rem;color:var(--muted);white-space:nowrap}
.stpick button[aria-pressed="true"]{font-weight:700;background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.stpick .sp-hard[aria-pressed="true"]{color:var(--pen);background:var(--pen-soft)}.stpick .sp-learning[aria-pressed="true"]{background:var(--mark);color:var(--fg)}.stpick .sp-known[aria-pressed="true"]{color:var(--ok);background:var(--ok-soft)}
.v-row .stpick{margin-top:8px}
.empty{text-align:center;color:var(--muted);padding:32px 8px}
.note{font-size:.85rem;color:var(--muted)}
</style>
</head>
<body>
<header><div class="in"><h1>SPA <b>교정 노트</b></h1><span class="row" style="align-items:center;gap:10px"><span class="stat" id="hstat"></span><button class="spk" id="addh" aria-label="교정 자료 추가" style="font-size:1.2rem;line-height:1">+</button></span></div></header>
<main class="wrap" id="app"><p class="empty">불러오는 중…</p></main>
<nav><div class="in">
  <button id="t-cards" data-tab="cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>어휘 카드</button>
  <button id="t-answers" data-tab="answers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10a7 7 0 0 1-14 0M12 17v5"/></svg>답변 연습</button>
  <button id="t-list" data-tab="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>전체 목록</button>
</div></nav>

<script>
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
let D={vocab:[],answers:[]}, S={box:{},card:{},done:{},doneId:{},tab:'cards',vf:'due',af:'전체'};
let sec='practice';let cur=null, revealed=false, openAns=null, tts=null, dict=null, attempt='', listening=false, q='';

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function load(){try{const s=JSON.parse(localStorage.getItem('spa-state')||'null');if(s)S={...S,...s}}catch(e){}}
function save(){try{localStorage.setItem('spa-state',JSON.stringify(S))}catch(e){}}
const vid=v=>v.wrong+'→'+v.right;
const titleOf=q=>q.replace(/^\[[^\]]+\]\s*/,'');
function tagOf(q){if(/^summari[sz]e\b/i.test(titleOf(q)))return'요약';const m=q.match(/^\[([^\]]+)\]/);if(!m)return'기타';const t=m[1];const tm=t.match(/^Test \d+/);return tm?tm[0]:t}

/* ---------- speech ---------- */
async function speak(text,btn){
  document.querySelectorAll('.spk.on').forEach(b=>b.classList.remove('on'));
  if(btn)btn.classList.add('on');
  const off=()=>btn&&btn.classList.remove('on');
  try{
    if(tts){await tts.speak(text,{language:'en',rate:.95});off();return}
  }catch(e){if(e&&e.code==='not_granted')tts=null;else{off();return}}
  try{
    const ss=window.speechSynthesis;if(!ss){off();return}
    ss.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.95;u.onend=off;u.onerror=off;ss.speak(u);
  }catch(e){off()}
}
function spkBtn(text){return `<button class="spk" aria-label="발음 듣기" data-say="${esc(text)}">${SPK}</button>`}

/* ---------- vocab cards ---------- */
/* status per card id: {s:'hard'|'learning'|'known', n:streak} ; no entry = 새 카드 */
const NEED=3;
const ST={new:'새 카드',hard:'헷갈림',learning:'익히는 중',known:'외움'};
const stOf=v=>(S.card[v.id]&&S.card[v.id].s)||'new';
const nOf=v=>(S.card[v.id]&&S.card[v.id].n)||0;
function stLabel(v){const s=stOf(v);return s==='learning'?`익히는 중 ${nOf(v)}/${NEED}`:ST[s]}
let lastAct=null;
function setCard(v,s,n){lastAct={id:v.id,prev:S.card[v.id]?{...S.card[v.id]}:null,word:v.right,to:s};
  S.card[v.id]={s,n,t:Date.now()};save()}
function vocabPool(){
  const f=S.vf;
  if(f==='due')return D.vocab.filter(v=>stOf(v)!=='known');
  if(f==='all')return D.vocab.slice();
  return D.vocab.filter(v=>stOf(v)===f);
}
const PRI={hard:0,new:1,learning:2,known:3};
function pickCard(){
  const p=vocabPool();if(!p.length){cur=null;return}
  const rank=v=>PRI[stOf(v)]*10+nOf(v);
  const min=Math.min(...p.map(rank));const c=p.filter(v=>rank(v)===min&&v!==cur);
  const from=c.length?c:(p.length>1?p.filter(v=>v!==cur):p);cur=from[Math.floor(Math.random()*from.length)];revealed=false;
}
function srcLinks(v){const g=sourcesFor(v);return g.length?`<div><span class="lbl">이 실수가 나온 문제</span><div class="srcs">${g.map(x=>`<button class="src" data-jump="${esc(x.key)}"><span class="tag">${esc(x.tag)}</span>${esc(x.title)}</button>`).join('')}</div></div>`:''}
function rCards(){
  const c={new:0,hard:0,learning:0,known:0};D.vocab.forEach(v=>c[stOf(v)]++);
  const pct=D.vocab.length?Math.round(c.known/D.vocab.length*100):0;
  const f=[['due','외울 것',D.vocab.length-c.known],['hard','헷갈림',c.hard],['learning','익히는 중',c.learning],['known','외움',c.known],['all','전체',D.vocab.length]];
  let h=`<div class="stack">
  <div class="boxes">${['new','hard','learning','known'].map(k=>`<button class="boxb${S.vf===k?' on':''}" data-vf="${k}"><b>${c[k]}</b><span>${ST[k]}</span></button>`).join('')}</div>
  <div class="prog" aria-label="외운 비율 ${pct}%"><i style="width:${pct}%"></i></div>
  <div class="chips">${f.map(([k,l,n])=>`<button class="chip" data-vf="${k}" aria-pressed="${S.vf===k}">${l} ${n}</button>`).join('')}</div>
  ${lastAct?`<div class="undo"><span>‘${esc(lastAct.word)}’ → ${ST[lastAct.to]||lastAct.to}</span><button id="undo">되돌리기</button></div>`:''}`;
  if(!cur||(!vocabPool().includes(cur)&&pinned!==cur.id))pickCard();
  if(!cur){h+=`<div class="card empty">이 묶음에 남은 카드가 없어요.<br>다른 분류를 골라 보세요.</div></div>`;return h}
  const s=stOf(cur);
  h+=`<div class="card stack">
    <div class="row" style="justify-content:space-between;align-items:center"><span class="lbl">내가 한 실수</span><span class="tag st-${s}">${stLabel(cur)}</span></div>
    ${stPicker(cur)}
    <div class="wrong meaning">${esc(cur.wrong)}</div>
    <div><span class="lbl">뜻</span><div class="meaning">${esc(cur.meaning)}</div></div>`;
  if(!revealed){h+=`<button class="reveal" id="reveal">올바른 표현을 떠올린 뒤 눌러 확인</button></div>`}
  else{
    h+=`<div><span class="lbl">올바른 표현</span><div class="right">${esc(cur.right)}</div></div>
    <div class="ex"><p>${esc(cur.example)}</p>${spkBtn(cur.example)}</div>${srcLinks(cur)}</div>`;
    h+= s==='known'
      ? `<div class="row"><button class="btn bad" id="no">다시 외우기</button><button class="btn good" id="keep">계속 외움</button></div>`
      : `<div class="row"><button class="btn bad" id="no">헷갈려요</button><button class="btn good" id="yes">알았어요${s==='learning'&&nOf(cur)+1>=NEED?' → 외움':''}</button></div>
         <button class="btn ghost" id="known">이미 확실히 알아요 (바로 외움)</button>
         <p class="note" style="margin:0;text-align:center">알았어요를 ${NEED}번 연속 누르면 외움으로 넘어가요.</p>`;
  }
  return h+'</div>';
}
let pinned=null;

  document.getElementById('hstat').textContent=`외움 ${learned}/${D.vocab.length}`;
  const ta=document.getElementById('att');if(ta)ta.addEventListener('input',e=>{attempt=e.target.value});
  const qi=document.getElementById('q');if(qi)qi.addEventListener('input',e=>{q=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos)});
}
document.addEventListener('click',async e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.say){speak(t.dataset.say,t);return}
  if(t.dataset.tab){adding=false;S.tab=t.dataset.tab;save();window.scrollTo(0,0);render();return}
  if(t.dataset.vf){S.vf=t.dataset.vf;lastAct=null;save();pickCard();render();return}
  if(t.dataset.af){S.af=t.dataset.af;save();render();return}
  if(t.dataset.open!==undefined){openAns=t.dataset.open;sec='practice';attempt='';const g=groups().find(x=>x.key===openAns);if(g)g.latest.a._show=false;window.scrollTo(0,0);render();return}
  if(t.dataset.setst){const v=D.vocab.find(x=>x.id===t.dataset.id);if(v){setStatus(v,t.dataset.setst);if(S.tab==='cards'&&cur&&cur.id===v.id)pinned=v.id}render();return}
  if(t.dataset.lf){lf=t.dataset.lf;render();return}
  if(t.dataset.sec){stopMic();sec=t.dataset.sec;render();return}
  if(t.dataset.jump!==undefined){S.tab='answers';S.af='전체';openAns=t.dataset.jump;sec='history';attempt='';save();window.scrollTo(0,0);render();return}
  switch(t.id){
    case'reveal':pinned=pinned&&cur&&pinned===cur.id?pinned:null;revealed=true;render();break;
    case'yes':answerCard('yes');break;
    case'keep':answerCard('keep');break;
    case'known':answerCard('known');break;
    case'undo':if(lastAct){if(lastAct.prev)S.card[lastAct.id]=lastAct.prev;else delete S.card[lastAct.id];cur=D.vocab.find(v=>v.id===lastAct.id)||cur;revealed=true;lastAct=null;save();render()}break;
    case'no':answerCard('no');break;
    case'back':stopMic();openAns=null;render();break;
    case'show':stopMic();(groups().find(x=>x.key===openAns)||{latest:{a:{},i:-1}}).latest.a._show=true;render();break;
    case'add':adding=true;addMsg='';window.scrollTo(0,0);render();break;
    case'addback':adding=false;render();break;
    case'clip':
      try{const txt=await navigator.clipboard.readText();if(!txt.trim()){addMsg='<span style="color:var(--pen)">클립보드가 비어 있어요. JSON을 먼저 복사해 주세요.</span>'}else importTexts([{text:txt,src:'복사한 내용'}])}
      catch(e){addMsg='<span style="color:var(--pen)">클립보드를 읽지 못했어요. 아래 "직접 붙여 넣기"를 써 주세요.</span>'}
      render();break;
    case'addh':adding=true;addMsg='';S.tab='list';save();window.scrollTo(0,0);render();break;
    case'doimp':doImport(document.getElementById('imp').value);render();break;
    case'markdone':{const la=(groups().find(x=>x.key===openAns)||{latest:{a:{}}}).latest.a;if(la.id){S.doneId[la.id]=(S.doneId[la.id]||0)+1;save()}render();break}
    case'mic':
      if(listening){stopMic();break}
      try{const p=dict.start();listening=true;render();await p}catch(err){listening=false;if(err&&err.code==='not_granted')dict=null;render()}
      break;
  }
});
function stopMic(){if(dict&&listening){try{dict.stop()}catch(e){}}listening=false}

document.addEventListener('change',async e=>{
  if(e.target.id!=='impfile')return;
  const fs=[...e.target.files];if(!fs.length)return;
  importTexts(await Promise.all(fs.map(async f=>({text:await f.text(),src:'파일 '+f.name,fileDate:f.lastModified?new Date(f.lastModified).toISOString():null}))));render();
});
/* ---------- boot ---------- */
load();
/* ---------- encrypted data (AES-GCM, key from password via PBKDF2) ---------- */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let ENC=null;
async function keyFrom(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function unlock(key){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.ct));
  D=JSON.parse(new TextDecoder().decode(pt));baseN={v:D.vocab.length,a:D.answers.length};ensureIds(D);mergeInto(D,extra());migrate();render();
}
function lockScreen(msg){
  document.getElementById('app').innerHTML=`<form class="card stack" id="lock" style="margin-top:24px">
    <h2>비밀번호를 입력하세요</h2><p class="note" style="margin:0">처음 한 번만 입력하면 이 기기에서 기억합니다.</p>
    <input class="search" id="pw" type="password" autocomplete="current-password" placeholder="비밀번호">
    ${msg?`<p style="margin:0;color:var(--pen)">${msg}</p>`:''}
    <button class="btn primary" type="submit">열기</button></form>`;
  document.getElementById('lock').addEventListener('submit',async e=>{
    e.preventDefault();
    try{const k=await keyFrom(document.getElementById('pw').value);await unlock(k);
      try{localStorage.setItem('spa-key',JSON.stringify(await crypto.subtle.exportKey('jwk',k)))}catch(e){}}
    catch(err){lockScreen('비밀번호가 맞지 않아요. 다시 입력해 주세요.')}
  });
}
fetch('data.enc.json').then(r=>r.json()).then(async enc=>{
  ENC=enc;
  try{const j=JSON.parse(localStorage.getItem('spa-key')||'null');
    if(j){const k=await crypto.subtle.importKey('jwk',j,{name:'AES-GCM'},true,['decrypt']);await unlock(k);return}}catch(e){}
  lockScreen();
}).catch(()=>{document.getElementById('app').innerHTML='<p class="empty">자료를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 보세요.</p>'});
(()=>{
  /* iOS/Chrome speech recognition (optional) */
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return;
  let rec=null,base='';
  dict={
    start(){return new Promise((res,rej)=>{
      rec=new SR();rec.lang='en-US';rec.continuous=true;rec.interimResults=true;
      base=attempt?attempt.trim()+' ':'';
      rec.onresult=ev=>{let fin='',part='';for(const r of ev.results){if(r.isFinal)fin+=r[0].transcript+' ';else part+=r[0].transcript}
        attempt=(base+fin).replace(/\s+/g,' ');const ta=document.getElementById('att');if(ta)ta.value=(attempt+' '+part).trim()};
      rec.onerror=ev=>{listening=false;render();if(ev.error==='not-allowed'){dict=null;render();rej({code:'not_granted'})}else res()};
      rec.onend=()=>{listening=false;render();res()};
      try{rec.start()}catch(e){rej(e)}
    })},
    stop(){try{rec&&rec.stop()}catch(e){}}
  };
  render();
})();
const APP_VERSION='v9 (11/21)';
if('serviceWorker' in navigator){
  const hadController=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadController&&!reloaded){reloaded=true;location.reload()}});
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{})});
}
